version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - copyloopvar

  settings:
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1000

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - revive
          - gosec
      - linters:
          - revive
        text: "exported: |package-comments:|should have (a )?package comment"
      - linters:
          - gosec
        text: "G704|G304"

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          # 32-bit-style oddity kept out; windows/arm64 is fine.
          # No excludes needed today.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: |
          NAME="viktor-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then NAME="$NAME.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "$NAME" ./cmd/viktor
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"

      - uses: softprops/action-gh-release@v2
        with:
          files: viktor-*

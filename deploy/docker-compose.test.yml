# Card #844: disposable Qdrant for the integration suite.
#   docker compose -f deploy/docker-compose.test.yml up -d --wait
#   VIKTOR_QDRANT_TEST_URL=http://localhost:6333 go test ./internal/memory -run TestQdrantIntegration
#   docker compose -f deploy/docker-compose.test.yml down -v
services:
  qdrant-test:
    image: qdrant/qdrant
    container_name: viktor-qdrant-test
    ports:
      - "6333:6333"
    volumes:
      - qdrant-test-data:/qdrant/storage
volumes:
  qdrant-test-data:
